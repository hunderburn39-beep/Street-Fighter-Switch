name: Visual bridge regression
on:
  push:
    branches: [remaster-only]
  workflow_dispatch:
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run
        run: |
          cc -std=c99 -Wall -Wextra -Werror -fsanitize=address,undefined remaster/visual_bridge.c tools/test_visual_bridge.c -o /tmp/visual-bridge-test
          /tmp/visual-bridge-test

          cc -std=c99 -Wall -Wextra -Werror -c remaster/visual_bridge.c -o /tmp/visual-bridge.o
          c++ -std=c++11 -Wall -Wextra -Werror tools/test_visual_queue.cpp /tmp/visual-bridge.o -o /tmp/visual-queue-test
          /tmp/visual-queue-test
          c++ -std=c++11 -Wall -Wextra -Werror tools/test_visual_session.cpp /tmp/visual-bridge.o -o /tmp/visual-session-test
          /tmp/visual-session-test
          c++ -std=c++11 -Wall -Wextra -Werror tools/test_replacement_index.cpp -o /tmp/replacement-index-test
          /tmp/replacement-index-test
          c++ -std=c++11 -Wall -Wextra -Werror tools/test_replacement_commands.cpp -o /tmp/replacement-commands-test
          /tmp/replacement-commands-test
          c++ -std=c++11 -Wall -Wextra -Werror tools/test_replacement_geometry.cpp -o /tmp/replacement-geometry-test
          /tmp/replacement-geometry-test
