name: Build Switch Remaster NRO
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the NRO as a GitHub pre-release'
        type: boolean
        default: false
  push:
    branches: [remaster-only]
    tags: ['remaster-v*']
    paths:
      - '.github/workflows/switch-remaster-nro.yml'
      - 'remaster/**'
      - 'tools/patch_visual_bridge.py'
      - 'tools/pack_replacements.py'
concurrency:
  group: switch-remaster-nro-${{ github.ref }}
  cancel-in-progress: true
env:
  CORE_REVISION: c7516a813cfc0dcc80508dadfeb9d8c62d710af0
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - name: switch_main.cpp compile check
        run: |
          sudo apt-get update && sudo apt-get install -y libegl-dev libgles-dev
          sh remaster/tests/check_switch_main.sh
      - name: Native unit tests
        run: |
          set -eux
          gcc -Wall -Wextra -Werror -c remaster/visual_bridge.c -o bridge.o
          gcc -Wall -Wextra -Werror -Iremaster tools/test_visual_bridge.c bridge.o -o t_bridge && ./t_bridge
          for t in visual_queue visual_session; do
            g++ -std=c++17 -Wall -Wextra -Werror -Iremaster tools/test_$t.cpp bridge.o -o t_$t && ./t_$t
          done
          for t in replacement_index replacement_commands replacement_geometry hd_blit hd_asset_pack; do
            g++ -std=c++17 -Wall -Wextra -Werror -Iremaster tools/test_$t.cpp -o t_$t && ./t_$t
          done

  build:
    needs: host-tests
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - run: dkp-pacman -S --needed --noconfirm switch-mesa switch-zlib switch-bzip2 switch-libpng switch-libjpeg-turbo
      - name: Inspect Mesa libraries
        run: |
          ls -l "$DEVKITPRO/portlibs/switch/lib/"*GL* "$DEVKITPRO/portlibs/switch/lib/"*nouveau* || true
          test -f "$DEVKITPRO/portlibs/switch/lib/libGLESv2.a"
      - name: Ensure python3
        run: command -v python3 || (apt-get update && apt-get install -y python3)
      - uses: actions/cache/restore@v4
        id: core-cache
        with:
          path: core
          key: switch-mame-core-bridge-v1-${{ env.CORE_REVISION }}-${{ hashFiles('tools/patch_visual_bridge.py', 'remaster/visual_bridge.h', 'remaster/visual_bridge.c') }}
      - name: Build static core with graphics bridge
        if: steps.core-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -eux
          git init core
          git -C core fetch --depth 1 https://github.com/libretro/mame2003-plus-libretro.git "$CORE_REVISION"
          git -C core checkout FETCH_HEAD
          cp remaster/visual_bridge.h core/src/vidhrdw/
          python3 tools/patch_visual_bridge.py core/src/vidhrdw/itech32_vidhrdw.c
          cat remaster/visual_bridge.c >> core/src/vidhrdw/itech32_vidhrdw.c
          grep -q 'sftm_emit_display' core/src/vidhrdw/itech32_vidhrdw.c
          make -C core platform=libnx -j2
      - uses: actions/cache/save@v4
        if: steps.core-cache.outputs.cache-hit != 'true'
        with:
          path: core
          key: switch-mame-core-bridge-v1-${{ env.CORE_REVISION }}-${{ hashFiles('tools/patch_visual_bridge.py', 'remaster/visual_bridge.h', 'remaster/visual_bridge.c') }}
      - name: Build Libretro support library
        shell: bash
        run: |
          set -eux
          export PATH="$DEVKITPRO/devkitA64/bin:$PATH"
          common=$(find core -type d -name libretro-common -print -quit)
          test -n "$common"
          mkdir -p support
          for dir in file streams vfs string encodings compat time features; do
            if [ -d "$common/$dir" ]; then
              for src in "$common/$dir/"*.c; do
                [ -f "$src" ] || continue
                case "$src" in *archive_file_7z.c|*archive_file_chd.c|*vfs_implementation_cdrom.c|*compat_ifaddrs.c) continue ;; esac
                if grep -qE "#include [<\"](libchdr/|7z/)" "$src"; then continue; fi
                aarch64-none-elf-gcc -O2 -D__SWITCH__ -DSWITCH -DHAVE_LIBNX -DHAVE_ZLIB -I"$common/include" -I"$DEVKITPRO/libnx/include" -I"$DEVKITPRO/portlibs/switch/include" -c "$src" -o "support/${dir}_$(basename "$src" .c).o"
              done
            fi
          done
          aarch64-none-elf-ar rcs support/libsupport.a support/*.o
      - name: Compile and link native frontend
        shell: bash
        run: |
          set -eux
          export PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH"
          archive=$(find core -name '*libretro*libnx*.a' -print -quit)
          test -n "$archive"
          # The bridge must be inside the core archive or the frontend cannot link.
          # (Dump to a file first: `nm | grep -q` under pipefail dies with SIGPIPE, exit 141.)
          aarch64-none-elf-nm -g --defined-only "$archive" > /tmp/core-symbols.txt
          grep -w sftm_visual_bind /tmp/core-symbols.txt
          git clone --depth 1 https://github.com/switchbrew/switch-examples.git official
          mkdir -p native/source
          cp official/templates/application/Makefile native/Makefile
          cp remaster/*.hpp remaster/visual_bridge.h remaster/switch_main.cpp native/source/
          cp "$archive" native/libmame.a
          cp support/libsupport.a native/libsupport.a
          sed -i -E 's/^TARGET[[:space:]]*:=.*/TARGET := Street-Fighter-Remaster/; s/^CXXFLAGS[[:space:]]*:=.*/CXXFLAGS := $(CFLAGS) -std=c++17 -fexceptions/; s@^LIBS[[:space:]]*:=.*@LIBS := -Wl,--start-group $(TOPDIR)/libmame.a $(TOPDIR)/libsupport.a -lEGL -lglapi -ldrm_nouveau -lGLESv2 -lpng -lz -lbz2 -lnx -lm -Wl,--end-group@' native/Makefile
          make -C native -j2 APP_TITLE="Street Fighter Remaster" APP_AUTHOR="SFTM Project" APP_VERSION="0.3"
          mkdir -p output/switch/sftm/hd
          cp native/Street-Fighter-Remaster.nro output/switch/sftm/
          if [ -d remaster/hd ]; then cp -r remaster/hd/. output/switch/sftm/hd/; fi
          test -s output/switch/sftm/Street-Fighter-Remaster.nro
      - uses: actions/upload-artifact@v4
        with:
          name: Street-Fighter-Remaster-Switch
          path: output/

  release:
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || startsWith(github.ref, 'refs/tags/remaster-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Street-Fighter-Remaster-Switch
          path: dist
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; else tag="remaster-v0.3.${{ github.run_number }}"; fi
          cp dist/switch/sftm/Street-Fighter-Remaster.nro Street-Fighter-Remaster.nro
          cat > notes.md <<'EOF'
          Remaster-only Nintendo Switch frontend (NRO) - **pre-release, not a finished game**.

          What it does: MAME2003-plus runs the game logic, physics, AI, collisions and original audio.
          The core is patched to publish its blitter events; an independent OpenGL ES 3 renderer replays them
          into two persistent HD planes (flip, scale, skew, clip, transparency, wrap, shift-register clears,
          scroll) using redrawn textures. The native framebuffer is never displayed and there is no Original/HD toggle.

          What it does NOT contain, and why you will see a black screen without them:
          - the game ROM: put your own legally obtained `sftm.zip` in `sdmc:/switch/sftm/`
          - the HD texture pack (`hd/hd.idx` + `hd/hd-N.rgba`, built with `tools/pack_replacements.py`).
            The photorealistic redrawn sprites and backgrounds have not been produced yet.

          Sprites without an HD replacement are drawn as nothing (never as the original graphics) and are listed in
          `sdmc:/switch/sftm/unresolved.tsv`, which is the to-do list for the art pipeline.
          Frame-rate and timing logs are written to `sdmc:/switch/sftm/sftm-debug.log`.
          Not yet verified on real hardware.

          Includes the MAME2003-plus core (MAME non-commercial licence).
          EOF
          gh release create "$tag" Street-Fighter-Remaster.nro --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Street Fighter Remaster $tag (pre-release)" --notes-file notes.md
