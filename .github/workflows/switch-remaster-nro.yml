name: Build Switch Remaster NRO
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/switch-remaster-nro.yml','remaster/switch*','remaster/*.hpp','remaster/shaders/**']
concurrency:
  group: switch-remaster-nro-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - run: dkp-pacman -S --needed --noconfirm switch-mesa switch-zlib switch-bzip2 switch-libpng switch-libjpeg-turbo
      - name: Inspect Mesa libraries
        run: |
          ls -l "$DEVKITPRO/portlibs/switch/lib/"*GL* "$DEVKITPRO/portlibs/switch/lib/"*nouveau* || true
          test -f "$DEVKITPRO/portlibs/switch/lib/libGLESv2.a"
      - name: Resolve core revision
        id: revision
        run: echo "sha=$(git ls-remote https://github.com/libretro/mame2003-plus-libretro.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: core-cache
        with:
          path: core
          key: switch-mame-core-v2-${{ steps.revision.outputs.sha }}
      - name: Build static core
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/libretro/mame2003-plus-libretro.git core
          git -C core checkout "${{ steps.revision.outputs.sha }}"
          make -C core platform=libnx -j2
      - name: Build Libretro support library
        shell: bash
        run: |
          set -eux
          export PATH="$DEVKITPRO/devkitA64/bin:$PATH"
          common=$(find core -type d -name libretro-common -print -quit)
          test -n "$common"
          mkdir -p support
          for dir in file streams vfs string encodings compat time; do
            if [ -d "$common/$dir" ]; then
              for src in "$common/$dir/"*.c; do
                [ -f "$src" ] || continue
                aarch64-none-elf-gcc -O2 -D__SWITCH__ -DHAVE_ZLIB -I"$common/include" -I"$DEVKITPRO/libnx/include" -I"$DEVKITPRO/portlibs/switch/include" -c "$src" -o "support/${dir}_$(basename "$src" .c).o"
              done
            fi
          done
          aarch64-none-elf-ar rcs support/libsupport.a support/*.o
      - name: Compile and link native frontend
        shell: bash
        run: |
          set -eux
          export PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH"
          archive=$(find core -name '*libretro*libnx*.a' -print -quit)
          test -n "$archive"
          aarch64-none-elf-g++ -std=c++17 -O2 -D__SWITCH__ -march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -fPIE -I"$DEVKITPRO/libnx/include" -I"$DEVKITPRO/portlibs/switch/include" remaster/switch_main.cpp -specs="$DEVKITPRO/libnx/switch.specs" -L"$DEVKITPRO/portlibs/switch/lib" -L"$DEVKITPRO/libnx/lib" -Wl,--start-group "$archive" support/libsupport.a -lEGL -lglapi -ldrm_nouveau -lglapi -lGLESv2 -lz -lbz2 -lnx -lm -Wl,--end-group -o remaster.elf
          mkdir -p output/switch/sftm
          elf2nro remaster.elf output/switch/sftm/Street-Fighter-Remaster.nro
          cp remaster/shaders/hd.vert remaster/shaders/hd.frag output/switch/sftm/
          test -s output/switch/sftm/Street-Fighter-Remaster.nro
      - uses: actions/upload-artifact@v4
        with:
          name: Street-Fighter-Remaster-Switch
          path: output/
