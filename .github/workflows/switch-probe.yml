name: Switch ARM64 toolchain probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/switch-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Check SDK
        run: |
          set -eu
          echo "$DEVKITPRO"
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++" --version
          test -f "$DEVKITPRO/libnx/include/switch.h"
          dkp-pacman -S --needed --noconfirm switch-sdl2 switch-sdl2_ttf
          test -f "$DEVKITPRO/portlibs/switch/include/SDL2/SDL.h"
          ls "$DEVKITPRO/portlibs/switch/lib"/libSDL2*
          command -v elf2nro || test -x "$DEVKITPRO/tools/bin/elf2nro"
