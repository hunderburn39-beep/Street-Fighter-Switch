name: Experimental Switch MAME core
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/switch-core.yml']
jobs:
  core:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Build static libretro core
        shell: bash
        run: |
          set -eux
          git clone --depth 1 https://github.com/libretro/mame2003-plus-libretro.git core
          cd core
          export PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH"
          make platform=libnx -j2
          find . -name '*libretro*.a' -print
          mkdir -p ../output
          find . -name '*libretro*.a' -exec cp {} ../output/ \;
          test -n "$(ls -A ../output)"
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-switch-core
          path: output/
