name: Switch startup diagnostic
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/switch-startup-diagnostic.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Build official devkitPro template
        shell: bash
        run: |
          set -eux
          git clone --depth 1 https://github.com/devkitPro/switch-examples.git examples
          cd examples/templates/application
          make -j2
          cd ../../..
          mkdir -p output
          cp examples/templates/application/*.nro output/SFTM-Official-Probe.nro
          test -s output/SFTM-Official-Probe.nro
      - uses: actions/upload-artifact@v4
        with:
          name: SFTM-Startup-Probe
          path: output/
